[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-dynamic-tractography"
version = "0.4.1"
description = "Interactive research visualization of electrophysiology events and tractography"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "nibabel>=5.2", "nilearn>=0.11"]

[project.scripts]
dynamic-tractography = "dynamic_tractography.app:main"

[tool.setuptools.package-data]
dynamic_tractography = ["web/*"]











